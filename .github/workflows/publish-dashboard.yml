name: Publish read-only workbench

# Build this workspace into a self-contained static SPA and publish it to the
# gh-pages branch at workbench/ (served at
# https://vivarium-collective.github.io/viva-fenics/workbench/). A read-only
# mirror of every investigation + study on main, browsable with no server.
# (A legacy /dashboard/ path is kept as a redirect to /workbench/.)
#
# Scaffolded by viva_superpowers.publish_assets.emit(). DEPLOY job
# (post-merge), not a PR gate; it writes workbench/ (+ a dashboard/ redirect)
# on gh-pages.

on:
  push:
    branches: [main]
    paths:
      - 'workspace/**'
      - 'investigations/**'
      - 'studies/**'
      - 'workspace.yaml'
      - 'reports/figures/**'
      - 'scripts/publish_dashboard.sh'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: publish-dashboard
  cancel-in-progress: true

permissions:
  contents: write   # push to the gh-pages branch

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VIVARIUM_WORKBENCH_REQUIRE_LOOM: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
          # Re-resolve instead of --locked: this workspace pins its framework
          # deps (process-bigraph, vivarium-workbench, viva-superpowers) as
          # `branch = "main"` git deps, so a committed pixi.lock goes stale the
          # moment any upstream main moves — which made `pixi install --locked`
          # reject an otherwise-valid lock on every publish. A publish job wants
          # the CURRENT main deps anyway, so resolve fresh each run.
          locked: false
          frozen: false

      - name: Refresh framework git deps to current main
        # locked:false lets pixi re-solve, but it does NOT advance a
        # `branch = "main"` git dep — pixi keeps the commit pinned in pixi.lock
        # until an explicit update, so a publish silently ships a stale
        # vivarium-workbench bundle. Bump the branch=main framework deps to the
        # current tip before building.
        run: pixi update vivarium-workbench process-bigraph viva-superpowers

      - name: Build read-only workbench snapshot
        # fenics-dolfinx is conda-only, so the static build runs under pixi's
        # locked env (pixi.lock, channel: conda-forge) rather than a uv venv —
        # this gives composite discovery real dolfinx instead of degrading to
        # an unresolved composite.
        env:
          # Composite discovery imports dolfinx, which calls MPI_Init. Force UCX
          # onto TCP / shared-memory / self so it doesn't try to open an RDMA
          # (ud_verbs) interface the GitHub runner lacks — otherwise MPI_Init
          # aborts with "UCX ERROR uct_iface_open(ud_verbs...) Address not valid".
          UCX_TLS: tcp,sm,self
          OMPI_MCA_btl: "^openib"
        run: pixi run bash scripts/publish_dashboard.sh reports/published/workbench

      - name: Publish to gh-pages (create the branch if absent)
        run: |
          set -euo pipefail
          if [ ! -f reports/published/workbench/index.html ]; then
            echo "::error::build produced no bundle (no index.html); nothing to publish"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git worktree add --detach /tmp/ghp HEAD
          cd /tmp/ghp
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
          fi
          rm -rf workbench && mkdir -p workbench
          cp -R "$GITHUB_WORKSPACE/reports/published/workbench/." workbench/
          # Legacy /dashboard/ path → redirect to /workbench/ so old links
          # (README showcase, external bookmarks) keep resolving.
          rm -rf dashboard && mkdir -p dashboard
          cat > dashboard/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>viva-fenics</title>
          <meta http-equiv="refresh" content="0; url=../workbench/">
          <link rel="canonical" href="../workbench/">
          <script>location.replace('../workbench/' + location.search + location.hash)</script>
          <a href="../workbench/">viva-fenics read-only workbench →</a>
          HTML
          git add -A
          if git diff --cached --quiet; then
            echo "read-only workbench snapshot unchanged; skipping commit"
          else
            git commit -m "gh-pages: republish read-only workbench (automated, ${GITHUB_SHA::7})"
            git push origin gh-pages
            echo "published read-only workbench to gh-pages:workbench/ (+ dashboard/ redirect)"
          fi
