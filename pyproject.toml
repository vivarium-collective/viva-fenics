[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-fenics"
version = "0.1.0"
description = "Process-bigraph wrapper for FEniCSx (dolfinx)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["viva_fenics"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

[project.optional-dependencies]
dev = ["pytest"]
