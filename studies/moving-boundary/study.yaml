schema_version: 4
name: moving-boundary
title: "Moving boundary: diffusion on a deforming (ALE) domain"
created: '2026-07-31'
status: planned
phase: Build

question: |
  Does a real dolfinx diffusion solve, re-assembled and re-solved every
  substep on a mesh whose geometry is mutated in place according to a
  prescribed moving-boundary law (prescribed ALE mesh motion), stay
  numerically well-behaved -- boundary tracking the prescribed law, domain
  measure scaling correctly with the deformation amplitude, field staying
  finite -- when wrapped as a process-bigraph Process?
hypothesis: |
  `MovingBoundaryProcess` should reproduce the prescribed top-boundary law
  `y_top(t)` to near machine precision (the mesh deformation is an exact
  uniform vertical stretch, not an approximation), the FEM-assembled domain
  area should scale linearly with the oscillation amplitude (a larger
  amplitude produces a proportionally larger swing in domain measure away
  from the base area), and the diffusion field solved on the deforming mesh
  should remain finite and bounded throughout, since no term in the
  backward-Euler diffusion assembly can blow up under a smooth, bounded
  mesh deformation.
objective: |
  Run the `moving_boundary` composite (a single `MovingBoundaryProcess` --
  real dolfinx diffusion re-solved on a prescribed-ALE deforming mesh) and
  verify (a) `boundary_position` tracks the prescribed oscillation law to
  near machine precision, (b) `domain_measure`'s swing away from the base
  area scales with the oscillation amplitude across an amplitude sweep, and
  (c) the diffusion field stays finite and bounded across the run.
description: |
  Wraps a single `MovingBoundaryProcess` in the `moving_boundary` composite
  generator. Each tick, the process advances the mesh motion and diffusion
  field by `dt`-sized substeps: (1) evaluate the prescribed boundary law
  `y_top(t)` (`mode="oscillate"`: `1 + amplitude*sin(omega*t)`;
  `mode="grow"`: `1 + amplitude*t`), (2) mutate `domain.geometry.x` in
  place -- a uniform vertical stretch of the reference (t=0) unit-square
  y-coordinates, mapping the fixed bottom boundary to y=0 and the moving
  top boundary to y=y_top(t) -- and (3) re-assemble and re-solve a
  backward-Euler diffusion step with a fresh `dolfinx.fem.petsc.LinearProblem`
  on that deformed geometry. This is the PRESCRIBED-mesh-motion ALE
  fallback explicitly sanctioned for this showcase (real dolfinx geometry
  mutation + a genuine re-solve every substep on the true deformed cells --
  not a mock, not a cosmetic coordinate transform after the fact). Because
  only the domain's height changes (width stays 1), the FEM-assembled
  `domain_measure` (`integral(1) dx` over the current mesh) should equal
  `boundary_position` to near machine precision -- a strong,
  non-tautological cross-check that the mesh geometry really was mutated.

  This is an ADVANCED, showcase-tier study: it is the investigation's only
  deforming-domain demo, and the first process whose mesh itself (not just
  its solution field) is time-varying state.

baseline:
- name: moving-boundary-baseline
  composite: viva_fenics.composites.moving_boundary.moving_boundary
  params:
    resolution: 32
    amplitude: 0.3
    omega: 3.14159
    dt: 0.01
    mode: oscillate

variants:
- name: amplitude-low
  base_composite: moving-boundary-baseline
  parameter_overrides:
    amplitude: 0.1
- name: amplitude-high
  base_composite: moving-boundary-baseline
  parameter_overrides:
    amplitude: 0.5
- name: grow-mode
  base_composite: moving-boundary-baseline
  parameter_overrides:
    mode: grow
    amplitude: 0.5

expected_behavior:
- name: boundary-follows-prescribed-law
  en: "boundary_position at the end of the baseline run matches the analytic oscillation law 1 + amplitude*sin(omega*t) to within 1e-4."
  observable: boundary_position
  condition: abs(boundary_position(T) - analytic(T)) < 1e-4
  rationale: >-
    The mesh deformation is an exact uniform vertical stretch of the
    reference y-coordinates by y_top(t), so the mesh's actual top-boundary
    coordinate should track the prescribed law to near machine precision,
    not merely approximately -- confirming the ALE mesh motion is a real
    geometry mutation driven by the prescribed law, not an independent or
    drifting quantity.
  measure:
    kind: derived_scalar
    field: boundary_law_abs_error
  expect:
    op: "<"
    value: 0.0001
- name: domain-measure-scales-with-amplitude
  en: "The domain_measure swing (max deviation from the base area 1.0) for the amplitude=0.5 variant is at least 3x that of the amplitude=0.1 variant."
  observable: domain_measure
  condition: swing(amplitude=0.5) >= 3x swing(amplitude=0.1)
  rationale: >-
    domain_measure = 1 * y_top(t) exactly (unit-width domain), so its
    deviation from the base area 1.0 should scale linearly with the
    oscillation amplitude; a 5x amplitude ratio (0.5 vs 0.1) should produce
    a clearly separated swing ratio, well above solver/sampling noise.
  measure:
    kind: derived_scalar
    field: swing_ratio
  expect:
    op: ">="
    value: 3.0
- name: field-stays-finite
  en: "The diffusion field's maximum absolute value stays below 5.0 throughout the baseline run (no blow-up on the deforming mesh)."
  observable: max_abs_field
  condition: max(|field|) < 5.0 over the run
  rationale: >-
    Backward-Euler diffusion is unconditionally stable for any fixed mesh;
    re-solving it every substep on a smoothly, boundedly deforming mesh
    should not introduce a blow-up mechanism -- this test locks that the
    prescribed-ALE re-solve stays numerically well-behaved across the run.
  measure:
    kind: derived_scalar
    field: max_abs_field
  expect:
    op: "<"
    value: 5.0

behavior_tests:
- name: boundary-follows-prescribed-law
  classification: primary
  description: |
    abs(boundary_position(T) - (1 + amplitude*sin(omega*T))) for the
    baseline run must be below 1e-4 at the final recorded time T.
  measure:
    kind: derived_scalar
    field: boundary_law_abs_error
  pass_if:
    op: "<"
    value: 0.0001
    provenance:
      kind: theory
      note: >-
        The mesh motion is deform_mesh()'s exact uniform stretch by
        y_top(t); the only departure from exact equality is floating-point
        roundoff (observed ~1e-15 during development), so 1e-4 leaves
        enormous headroom while still catching a genuinely broken mesh
        motion (e.g. a stale/undeformed mesh).
  requires_simulation: moving-boundary-baseline
- name: domain-measure-scales-with-amplitude
  classification: primary
  description: |
    max(|domain_measure - 1.0|) over the amplitude=0.5 variant's run must
    be at least 3x the same quantity for the amplitude=0.1 variant, over
    the same duration/wiring.
  measure:
    kind: derived_scalar
    field: swing_ratio
  pass_if:
    op: ">="
    value: 3.0
    provenance:
      kind: calibration
      note: >-
        domain_measure = y_top(t) exactly, so the analytic swing ratio for
        a 5x amplitude ratio is exactly 5.0; 3.0 leaves headroom for
        transient/sampling effects (peak not landing exactly at the same
        sampled tick in both runs) while still catching a broken or
        amplitude-insensitive mesh motion.
  requires_simulation: amplitude-low
- name: field-stays-finite
  classification: supporting
  description: |
    max(|field|) across every recorded frame of the baseline run must stay
    below 5.0 -- no blow-up from re-solving on the deforming mesh.
  measure:
    kind: derived_scalar
    field: max_abs_field
  pass_if:
    op: "<"
    value: 5.0
    provenance:
      kind: theory
      note: >-
        Backward-Euler diffusion of a bounded gaussian-bump initial
        condition (peak amplitude 1.0) with no source term cannot exceed
        its initial peak in the continuous limit; 5.0 leaves generous
        headroom for discretization overshoot on the deforming mesh while
        still catching a genuine numerical blow-up.
  requires_simulation: moving-boundary-baseline

pipeline_gate:
  prerequisites:
  - study: navier-stokes
    condition: tests-passed
  enables: []
  proceed_condition: |
    No further studies in this investigation currently depend on
    moving-boundary; it is the investigation's deforming-domain showcase,
    built on top of navier-stokes (the investigation's other advanced,
    showcase-tier study) rather than directly on the scalar
    diffusion/reaction studies.

canonical_runs:
- name: default
  script: studies/moving-boundary/sims/run.py
  args: []
  label: "diffusion on a deforming domain (resolution=32, oscillate amplitude=0.3/0.1/0.5 + grow)"
  default: true

visualizations:
- name: moving-boundary-animation
  chart: viz/moving_boundary.html
  render: "python sims/run.py"

conclusion: null
