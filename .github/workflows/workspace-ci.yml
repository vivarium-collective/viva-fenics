name: workspace-ci
on: [push, pull_request]

# CI for viva-fenics, a pixi (conda) workspace.
#
# fenics-dolfinx has no PyPI wheel (conda-only), so this workflow installs the
# full environment via pixi from pixi.lock (channel: conda-forge) rather than
# uv/pip. That gives every job real dolfinx — no skipped tests.
#
# Sequence:
#   1. Check out the workspace.
#   2. Fail fast on leaked local absolute paths (pyproject/pixi.toml hygiene).
#   3. Install pixi + the locked env (prefix-dev/setup-pixi resolves
#      pixi.lock for the runner's platform, i.e. linux-64).
#   4. Lint workspace.yaml against the JSON schema.
#   5. Run pytest for the whole workspace.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # Fail fast if a local absolute path (file:///, /Users/, /home/) was
      # committed into a tracked file — a recurring CI break when a sibling
      # editable install leaks into pyproject.toml/pixi.toml. Only needs the
      # repo, so it runs right after checkout, before any env-dependent step.
      - name: Check for leaked local paths
        run: bash scripts/check-no-local-paths.sh
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - name: Lint workspace
        run: pixi run python scripts/lint-workspace.py
      - name: Run workspace tests
        run: pixi run pytest -q
