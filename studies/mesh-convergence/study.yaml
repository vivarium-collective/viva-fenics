schema_version: 4
name: mesh-convergence
title: "Mesh convergence: FEM rigor"
created: '2026-07-31'
status: planned
phase: Build

question: |
  Does the `PoissonSolverStep` wrapper deliver the theoretical O(h^2) mesh
  convergence rate for P1 Lagrange elements, or does the wrapping introduce
  an artifact that masks/inflates the true discretization error?
hypothesis: |
  On a superconvergence-resistant (crossed-diagonal) unit-square mesh, the
  L2 error of a P1 (degree=1) solve should scale as O(h^2) across a
  resolution sweep, giving an observed log-log slope near 2.
objective: |
  Sweep the `mesh_convergence` composite's `resolution` parameter (8, 16, 32)
  at fixed polynomial degree 1, fit the L2-error-vs-mesh-size slope on a
  log-log plot, and confirm the fitted rate matches the theoretical
  O(h^(degree+1)) convergence order.
description: |
  Reuses `PoissonSolverStep` (as `poisson-validation` does) but at
  degree=1 and swept over `resolution`, via the `mesh_convergence` composite
  generator -- one composite build per sweep point (the sweep itself lives
  in this study's `variants:`/runner, not in the generator, which
  parameterizes a single (resolution, degree) pair). `fem.build_mesh` uses
  dolfinx's "crossed" triangulation specifically to avoid a known P1
  superconvergence artifact on the default "right" diagonal that would
  collapse the error to round-off at every resolution and mask the true
  rate.

baseline:
- name: resolution-8
  composite: viva_fenics.composites.convergence.mesh_convergence
  params:
    resolution: 8
    degree: 1

variants:
- name: resolution-16
  base_composite: resolution-8
  parameter_overrides:
    resolution: 16
- name: resolution-32
  base_composite: resolution-8
  parameter_overrides:
    resolution: 32

expected_behavior:
- name: convergence-rate-matches-order
  en: "The fitted log-log convergence rate across resolution=[8,16,32] is at least 1.7 (theoretical O(h^2) is 2.0)."
  observable: convergence_rate
  condition: convergence_rate >= 1.7 (theoretical O(h^2) is 2.0)
  rationale: >-
    P1 Lagrange elements on a non-superconvergent mesh should converge at
    the theoretical O(h^2) rate for the L2 norm; a rate below 1.7 would
    indicate either a solver bug or an unintended superconvergence artifact
    (the same band tests/test_poisson.py::test_convergence_rate locks).
  measure:
    kind: derived_scalar
    field: convergence_rate
  expect:
    op: ">="
    value: 1.7

behavior_tests:
- name: convergence-rate-matches-order
  classification: primary
  description: |
    The fitted slope of log(l2_error) vs log(h) across resolution=[8,16,32]
    must be at or above 1.7 (theoretical O(h^2) is 2.0; 1.7 leaves headroom
    for mesh-dependent noise while still ruling out a broken/first-order
    solve).
  measure:
    kind: derived_scalar
    field: convergence_rate
  pass_if:
    op: ">="
    value: 1.7
    provenance:
      kind: theory
      note: >-
        Standard FEM a priori error theory gives O(h^(k+1)) for degree-k
        Lagrange elements in the L2 norm; k=1 implies rate=2. 1.7 is a
        calibration margin below the theoretical value, not a fitted
        threshold.
  requires_simulation: resolution-8

pipeline_gate:
  prerequisites:
  - study: poisson-validation
    condition: tests-passed
  enables: []
  proceed_condition: |
    No downstream studies in this investigation depend on mesh-convergence;
    it stands alongside transient-diffusion as a standalone FEM-rigor check
    on the poisson-validation baseline.

canonical_runs:
- name: default
  script: studies/mesh-convergence/sims/run.py
  args: []
  label: "convergence sweep: resolution=[8,16,32], degree=1"
  default: true

visualizations:
- name: convergence-loglog
  chart: viz/convergence.html
  render: "python sims/run.py"

conclusion: null
