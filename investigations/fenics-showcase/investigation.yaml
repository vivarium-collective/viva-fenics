schema_version: 2
name: fenics-showcase
title: "FEniCS showcase: FEM solvers as composable pbg processes"
created: '2026-07-31'
status: planning

question: |
  Can modern FEniCSx be wrapped as composable pbg processes that reproduce
  canonical FEM results and enable bigraph coupling?

hypothesis: |
  Wrapping dolfinx's Poisson, transient-diffusion, and logistic-reaction
  solvers as process-bigraph Steps/Processes preserves their numerical
  fidelity (manufactured-solution validation, O(h^2) mesh convergence,
  mass-conserving time-stepping) AND enables genuine bigraph composition:
  Fisher-KPP reaction-diffusion dynamics should emerge purely from two
  independently-authored processes (DiffusionProcess, LogisticReactionProcess)
  sharing bigraph stores, with neither process aware of the other.

description: |
  Seven studies build up from validation to composition to advanced,
  showcase-tier physics. `poisson-validation` and `mesh-convergence`
  establish that the dolfinx bridge reproduces textbook FEM numerics
  (manufactured-solution correctness, O(h^2) P1 convergence).
  `transient-diffusion` extends the bridge to time-stepped Processes and
  checks mass conservation under backward-Euler integration.
  `reaction-diffusion` is the coupling + visual headline: it wires TWO
  `DiffusionProcess` instances (species U, V; Du=2*Dv) and ONE
  `GrayScottReactionProcess` into shared `stores.u` / `stores.v` /
  `stores.source_u` / `stores.source_v` paths and shows a genuine 2D Turing
  instability -- spontaneous self-organization into spot/labyrinth/stripe
  patterns -- emerges from that three-process wiring alone, across three
  Gray-Scott parameter regimes -- the composability property the core of the
  investigation exists to demonstrate. Three ADVANCED studies extend the
  showcase beyond scalar diffusion/reaction: `navier-stokes` is the
  fluid-dynamics showpiece -- a von Karman vortex street (the DFG 2D-2
  benchmark: flow past an off-center cylinder in a channel, gmsh-generated
  cylinder-refined mesh, IPCS operator splitting, coupled P2/P1
  velocity-pressure spaces, real surface-force-integral drag/lift);
  `moving-boundary` is the first
  deforming-domain demo (prescribed-ALE mesh motion re-solved every
  substep); `complex-geometry` is the first non-rectangular-domain demo
  (gmsh-constructed obstacle/L-shape/annulus topologies imported into
  dolfinx). Runs are authored here (Task 7, extended Task 12); execution
  recorded into the workspace's `.pbg/runs.jsonl` run log plus behavior-test
  evaluation happens in Task 8.

studies:
- poisson-validation
- mesh-convergence
- transient-diffusion
- reaction-diffusion
- navier-stokes
- moving-boundary
- complex-geometry

executive:
  what_is_this: |
    A showcase investigation proving that a real external FEM solver
    (FEniCSx/dolfinx, not a mock or reimplementation) can be wrapped as
    process-bigraph Steps/Processes and composed like any other pbg model.
    Two validation studies (`poisson-validation`, `mesh-convergence`) confirm
    numerical fidelity against known analytic/theoretical results; two
    dynamics studies (`transient-diffusion`, `reaction-diffusion`) extend the
    bridge to time-stepping and cross-process coupling. Three ADVANCED
    studies (`navier-stokes`, `moving-boundary`, `complex-geometry`) push
    the same bridge into fluid dynamics, deforming domains, and
    gmsh-generated non-rectangular geometry.
  verdict: |
    Authored and lint-clean: 7 studies, each with a real `@composite_generator`
    baseline, a `sims/run.py` canonical runner, and an interactive viz.
    Standalone execution of every runner reproduces the expected numerics:
    l2_error ~2.8e-13 (poisson-validation, tol 1e-10), observed convergence
    rate ~2.00 (mesh-convergence, P1 -> O(h^2)), mass conserved with a
    decaying peak (transient-diffusion), a genuine Gray-Scott Turing
    instability -- V's spatial variance grows well past the 5x threshold
    from a near-uniform start, the pattern settles into a bounded, finite
    coverage fraction, and three (F,k) regimes produce measurably different
    morphology (reaction-diffusion; see the study report for the exact
    achieved values), a von Karman vortex street shedding off
    an off-center cylinder with oscillating drag/lift in the neighborhood of
    the DFG 2D-2 benchmark's reference Cd/Cl/Strouhal
    (navier-stokes), a deforming-mesh diffusion solve whose boundary tracks
    the prescribed law to near machine precision with a domain measure that
    scales with amplitude (moving-boundary), and finite, bounded,
    non-trivial Poisson solutions on three gmsh-generated topologies
    (complex-geometry).
  verdict_status: in-progress
  verdict_detail: |
    Task 7 scope: author the investigation + 4 core studies + runners and
    get them lint-clean and individually executable (done). Tasks 9-11
    scope: author the 3 advanced studies (navier-stokes, moving-boundary,
    complex-geometry) with the same rigor (done). Task 12 scope (this task):
    bind all 7 studies into this investigation's `studies:` list and extend
    `acceptance_criteria` accordingly (done). Task 8 scope (not yet done):
    drive these runners through `/viva-study run-script` so results land in
    the workspace's `.pbg/runs.jsonl` run log and the dashboard's Tests tab
    reflects the behavior tests declared below.
  decisions_needed: []

scientific_argument:
  main_claim: |
    A real dolfinx bridge, wrapped as ordinary process-bigraph Steps and
    Processes, reproduces canonical FEM validation results (MMS correctness,
    O(h^2) P1 convergence, mass-conserving transient diffusion) and, when
    THREE independently-authored processes (two DiffusionProcess instances
    plus one GrayScottReactionProcess) are wired to the same bigraph stores,
    produces a genuine 2D Turing instability -- spontaneous pattern
    self-organization -- without any of the three processes containing any
    knowledge of the others. The showcase now spans validation ->
    coupling -> fluid dynamics -> moving boundaries -> complex geometry:
    the same bridge that passes MMS/convergence checks and demonstrates
    store-wiring composability also drives a real incompressible
    Navier-Stokes solve, a prescribed-ALE deforming-mesh diffusion solve,
    and Poisson solves on gmsh-generated non-rectangular topologies --
    without departing from the bridge validated in the first four studies.
  evidence_for:
  - "poisson-validation: l2_error ~2.8e-13 against a quadratic manufactured
    solution with degree-2 Lagrange elements (Galerkin-exact), well inside
    the 1e-10 tolerance."
  - "mesh-convergence: observed P1 convergence rate ~2.00 across
    resolution=[8,16,32] on a superconvergence-resistant (crossed-diagonal)
    mesh, matching O(h^2) theory."
  - "transient-diffusion: the gaussian bump's peak decays under backward-Euler
    diffusion while the FEM-integral mass stays flat (Neumann/no-flux
    boundary), confirming the time-stepped Process wrapper conserves mass."
  - "reaction-diffusion: two DiffusionProcess instances (species U, V;
    Du=2*Dv) and one GrayScottReactionProcess, coupled purely through
    shared stores, produce a genuine Turing instability -- V's spatial
    variance grows well past a near-uniform start, the pattern is bounded
    and structurally non-trivial (a finite fraction of the domain, not all
    or none of it), and three (F,k) regimes produce measurably different
    coverage/morphology; see the study's report for the achieved values."
  - "navier-stokes: flow past an off-center cylinder (DFG 2D-2 benchmark,
    Re=100) sheds a genuine von Karman vortex street -- the lift coefficient
    oscillates once past the impulsive-start transient, the mean drag
    coefficient lands in the neighborhood of the DFG reference
    (Cd_max~=3.22-3.24), and the shedding frequency's Strouhal number lands
    in the neighborhood of the DFG reference (St~=0.30); see the study's
    report for the exact achieved values and production-run wall-time."
  - "moving-boundary: boundary_position tracks the prescribed oscillation
    law to near machine precision, the FEM-assembled domain_measure's swing
    scales with oscillation amplitude across an amplitude sweep, and the
    diffusion field stays finite/bounded throughout on the deforming mesh."
  - "complex-geometry: all three gmsh-generated topologies (obstacle,
    L-shape, annulus) import with cell counts in the low thousands (well
    above the 20-cell floor), and each Poisson solve is finite, bounded,
    and non-trivially nonzero, matching the maximum-principle expectation."
  evidence_against:
  - "All seven studies use a single fixed random-free deterministic setup
    (one resolution/degree/parameter point per study beyond the declared
    sweeps); broader parameter robustness beyond the declared sweeps
    (resolution in mesh-convergence, rate in reaction-diffusion,
    amplitude/mode in moving-boundary, geometry in complex-geometry) is
    untested. navier-stokes in particular is a single production run at
    one mesh/dt/duration chosen for feasible wall-time, not a mesh- or
    dt-convergence study -- see its report for the accuracy/runtime
    tradeoff made."
  - "Behavior tests are authored (Tasks 7, 9-11) but not yet run through the
    dashboard's Tests tab against the workspace's `.pbg/runs.jsonl` run log
    (Task 8), so the PASS/FAIL verdicts above come from the runner scripts'
    own printed checks, not the dashboard's evaluator."
  key_figures: []
  caveats:
  - "The coupling composability claim is demonstrated for one three-process
    wiring pattern (2x DiffusionProcess + GrayScottReactionProcess, and
    separately the simpler 2-process DiffusionProcess/LogisticReactionProcess
    Fisher-KPP pairing the same library still ships); it has not been
    exercised against an unrelated fourth process to further stress-test
    that the wiring pattern generalizes beyond diffusion+reaction."
  - "The classic Gray-Scott 'spots' regime (F=0.035, k=0.065) was found
    subcritical for this composite's Du/Dv/dt/domain-size combination during
    development (every seeding strategy tried decayed back to the trivial
    fixed point); the study's three regimes (coral/mitosis-like, labyrinth,
    stripes) were chosen because they were verified to grow robustly, not
    because they are the only regimes worth showing -- see the study report."
  - "The three advanced studies (navier-stokes, moving-boundary,
    complex-geometry) each stand on their own dolfinx bridge exercise --
    they are not yet cross-wired into a single combined composite (e.g.
    fluid flow on a deforming, non-rectangular domain), so the showcase
    demonstrates breadth of individual capability, not their joint
    composition."

