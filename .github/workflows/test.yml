name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (lean — the FEniCSx/dolfinx backend runs in its own conda/pixi image, not CI)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import check (dolfinx-free surface is importable anywhere)
        run: python -c "import viva_fenics; print('viva_fenics ok')"
